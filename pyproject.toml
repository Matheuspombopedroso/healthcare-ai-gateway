[project]
name = "healthcare-ai-gateway"
version = "0.1.0"
description = "Multi-tenant generative AI gateway demo: LiteLLM routing, Redis quotas, Postgres credits, fallback, TTFT metrics."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
# Versions pinned to what the tests and benchmarks in this repo were run with.
dependencies = [
    "litellm==1.111.0",
    "fastapi==0.165.0",
    "uvicorn==0.54.0",
    "httpx>=0.28,<1",
    "redis==8.2.0",
    "sqlalchemy[asyncio]==2.1.9",
    "asyncpg==0.32.0",
    "prometheus-client>=0.21",
    "pydantic>=2.9",
    "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["gateway", "mock_backend"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# One event loop per test keeps fixtures independent.
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::UserWarning:pydantic.*"]
