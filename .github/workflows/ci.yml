# Lint + tests on every push and pull request.
name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    # The tests need real Redis and Postgres (atomic Lua scripts, conditional
    # UPDATEs and CHECK constraints are part of what is being tested), so CI
    # starts them as service containers.
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 2s --health-retries 30
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: gateway
          POSTGRES_PASSWORD: gateway
          POSTGRES_DB: gateway
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U gateway" --health-interval 2s --health-retries 30
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://gateway:gateway@localhost:5432/gateway?ssl=disable
      TEST_REDIS_URL: redis://localhost:6379/15
      LITELLM_LOCAL_MODEL_COST_MAP: "True"   # no network fetch at import
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Tests
        run: pytest -q

  # End-to-end smoke test of the real stack: build the image, start
  # gateway + Redis + Postgres + mock with docker compose, then run the demo
  # script from the runner against the published ports.
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Start stack
        run: docker compose up -d --build
      - name: Wait for gateway
        run: curl -sf --retry 60 --retry-connrefused --retry-delay 2 http://localhost:8400/health
      - name: Run demo (one request per tenant, isolation, fallback, balances)
        run: |
          pip install httpx pydantic
          python scripts/generate_synthetic.py
          python scripts/demo.py
          curl -s http://localhost:8400/metrics | grep gateway_requests_total
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Tear down
        if: always()
        run: docker compose down -v
